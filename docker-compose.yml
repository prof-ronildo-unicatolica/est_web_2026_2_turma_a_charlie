services:
  # ─── Bancos de Dados ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: hotel-postgres
    restart: unless-stopped #always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      - POSTGRES_DB=${POSTGRES_DB:-hotel_db_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hotel_db_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: hotel-mongo
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ADMIN_PASSWORD:?Defina MONGO_ADMIN_PASSWORD no arquivo .env}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: hotel-rabbitmq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-hotel_app}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no arquivo .env}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend (Core Service) ─────────────────────────────────────────────────
  core-service:
    build:
      context: ./apps/services/core-service
      dockerfile: Dockerfile
    container_name: hotel-core-service
    restart: unless-stopped
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      - POSTGRES_DB=${POSTGRES_DB:-hotel_db_dev}
      - POSTGRES_PORT=5432
      - MONGODB_URL=${MONGODB_URL:?Defina MONGODB_URL no arquivo .env}
      - MONGO_ADMIN_PASSWORD=${MONGO_ADMIN_PASSWORD:?Defina MONGO_ADMIN_PASSWORD no arquivo .env}
      - MONGODB_DB=hotel_mongo_dev
      - SECRET_KEY=${SECRET_KEY:?Defina SECRET_KEY no arquivo .env}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:-}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-}
      - INITIAL_ADMIN_NAME=${INITIAL_ADMIN_NAME:-Administrador}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-hotel_app}:${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no arquivo .env}@rabbitmq:5672/
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: >
      sh -c "
        poetry run alembic upgrade head &&
        poetry run uvicorn app.main:app --host 0.0.0.0 --port 8000
      "

  audit-worker:
    build:
      context: ./apps/services/core-service
      dockerfile: Dockerfile
    container_name: hotel-audit-worker
    restart: unless-stopped
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      - POSTGRES_DB=${POSTGRES_DB:-hotel_db_dev}
      - POSTGRES_PORT=5432
      - MONGODB_URL=${MONGODB_URL:?Defina MONGODB_URL no arquivo .env}
      - MONGO_ADMIN_PASSWORD=${MONGO_ADMIN_PASSWORD:?Defina MONGO_ADMIN_PASSWORD no arquivo .env}
      - MONGODB_DB=hotel_mongo_dev
      - SECRET_KEY=${SECRET_KEY:?Defina SECRET_KEY no arquivo .env}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-hotel_app}:${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no arquivo .env}@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: poetry run python -m app.workers.audit_worker

  # ─── Frontend (React + Vite) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: hotel-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - core-service

volumes:
  postgres_data:
  mongo_data:
