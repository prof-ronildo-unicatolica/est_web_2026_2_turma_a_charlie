name: Validacao do projeto

on:
  push:
    branches:
      - develop
      - feat/reservas-avaliacoes-contas
  pull_request:
    branches:
      - develop

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/services/core-service
    env:
      MONGODB_URL: mongodb://localhost:27017
      MONGO_ADMIN_PASSWORD: test-only-password
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_DB: hotel_test
      SECRET_KEY: test-only-secret-key-that-is-long-enough
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
      - run: poetry install --no-interaction
      - run: poetry run ruff check --fix app/api/v1/interacoes.py app/api/v1/busca.py app/models/interacao.py app/services/busca_service.py app/services/audit_service.py app/core/seed_admin.py app/core/seed_mongo.py app/main.py
      - run: git diff -- app/main.py app/models/interacao.py
      - run: poetry run ruff check app/api/v1/interacoes.py app/api/v1/busca.py app/models/interacao.py app/services/busca_service.py app/services/audit_service.py app/core/seed_admin.py app/core/seed_mongo.py app/main.py
      - run: poetry run pytest -q
